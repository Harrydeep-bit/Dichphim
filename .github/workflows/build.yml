name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Giải nén mã nguồn (nếu tải lên dạng zip)
        run: if [ -f DichPhim.zip ]; then unzip -o DichPhim.zip; fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Đóng gói APK
        run: |
          if [ -d DichPhim/app ]; then cd DichPhim; fi
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/DichPhim.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: DichPhim-apk
          path: DichPhim.apk
      - name: Đưa APK lên nhánh "apk" để tải thẳng, không cần đăng nhập
        run: |
          mkdir /tmp/apk && cp DichPhim.apk /tmp/apk/
          cd /tmp/apk
          git init -q -b apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add DichPhim.apk
          git commit -q -m "APK từ lần build ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" apk
